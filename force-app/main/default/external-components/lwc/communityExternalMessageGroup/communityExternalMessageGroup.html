<template>
    <div
        class="aksel-chat aksel-chat--right aksel-chat--top-text-right aksel-chat--medium aksel-chat--neutral break-word"
        data-color="brand-beige"
        data-variant="neutral"
    >
        <div class="aksel-chat__avatar" aria-hidden="true">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                fill="none"
                viewBox="0 0 24 24"
                focusable="false"
                role="img"
            >
                <path

                    fill-rule="evenodd"
                    d="M8.25 7.5a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0M12 2.25a5.25 5.25 0 1 0 0 10.5 5.25 5.25 0 0 0 0-10.5M8.288 17.288A5.25 5.25 0 0 1 17.25 21a.75.75 0 0 0 1.5 0 6.75 6.75 0 0 0-13.5 0 .75.75 0 0 0 1.5 0 5.25 5.25 0 0 1 1.538-3.712"

                <div key={msgWrap.message.Id} class="aksel-chat__bubble" style={msgWrap.bubbleStyle}>

                        <h3 class="aksel-chat__top-text aksel-heading aksel-heading--xsmall">

                                <c-crm-nav-formatted-date

                            </span>
                        </h3>
                    </template>
                    <lightning-formatted-text
                        value={msgWrap.message.CRM_Message_Text__c}

                    ></lightning-formatted-text>
                </div>
            </template>
        </div>
    </div>
